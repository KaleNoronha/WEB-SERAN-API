version: "1"
services:
- type: web
  name: WEB-SERAN-API
  runtime: python
  repo: https://github.com/KaleNoronha/WEB-SERAN-API
  branch: prod
  plan: free
  envVars:
  - key: FRONTEND_URL
    sync: false
  - key: EMAIL_FROM
    sync: false
  - key: BREVO_API_KEY
    sync: false
